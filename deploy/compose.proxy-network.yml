# CODEHAVEN_PROXY=network: a reverse proxy you already run, on a docker network that already
# exists (CODEHAVEN_PROXY_NETWORK). The server joins that network under the alias
# CODEHAVEN_PROXY_ALIAS, and your proxy sends to <alias>:3200. Codehaven creates nothing on it and
# changes nothing about your proxy: add a site that points at the alias yourself.
#
# Set CODEHAVEN_TRUSTED_PROXIES to the subnet of that network, because only a peer inside it may
# set X-Forwarded-For and X-Forwarded-Proto. Your proxy must remove any Remote-User style header a
# client sends. See docs/operations.md.
services:
  server:
    networks:
      proxy:
        aliases: ["${CODEHAVEN_PROXY_ALIAS:?set CODEHAVEN_PROXY_ALIAS in .env}"]

networks:
  proxy:
    external: true
    name: ${CODEHAVEN_PROXY_NETWORK:?set CODEHAVEN_PROXY_NETWORK in .env}
