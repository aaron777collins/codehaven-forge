{% macro person_row(p) %}
<li class="person-row">
  <img class="avatar av-20" src="/avatar/{{ p.username }}.svg" alt="" width="20" height="20" loading="lazy">
  <div>
    <a href="{{ p.href }}">{{ p.display }}</a>
    {% if !p.chip.is_empty() %}<span class="chip {{ p.chip_class }}">{{ p.chip }}</span>{% endif %}
    <p class="muted small">@{{ p.username }}</p>
  </div>
</li>
{% endmacro %}

{% macro org_tabs(login, base, current, is_owner) %}
<nav class="tabs" aria-label="Sections">
  <a class="tab{% if current == "repos" %} current{% endif %}"{% if current == "repos" %} aria-current="page"{% endif %} href="{{ base }}">Repositories</a>
  <a class="tab{% if current == "people" %} current{% endif %}"{% if current == "people" %} aria-current="page"{% endif %} href="/orgs/{{ login }}/people">People</a>
  <a class="tab{% if current == "teams" %} current{% endif %}"{% if current == "teams" %} aria-current="page"{% endif %} href="/orgs/{{ login }}/teams">Teams</a>
  {% if is_owner %}<a class="tab{% if current == "settings" %} current{% endif %}"{% if current == "settings" %} aria-current="page"{% endif %} href="/orgs/{{ login }}/settings">Settings</a>{% endif %}
</nav>
{% endmacro %}
