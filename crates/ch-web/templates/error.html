<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ heading }}</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{ css }}">
</head>
<body class="bare">
<main class="auth-card" id="main">
  <p class="auth-mark"><a href="/" aria-label="Codehaven home"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 28V15a10 10 0 0 1 20 0v13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M11 20h10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></a></p>
  <p class="muted small">Error {{ status }}</p>
  <h1>{{ heading }}</h1>
  <p>{{ message }}</p>
  {% if !hint.is_empty() %}<p class="muted">{{ hint }}</p>{% endif %}
  <p><a class="btn" href="/">Back to the start page</a></p>
</main>
</body>
</html>
