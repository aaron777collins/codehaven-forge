name: Build, test, and report

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build release binary
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      checksum: ${{ steps.checksum.outputs.checksum }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --release
      - id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" >> "$GITHUB_OUTPUT"
      - id: checksum
        run: echo "checksum=$(sha256sum target/release/app | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: target/release/app

  test:
    name: Run test suite
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Echo the built version
        run: echo "Testing version ${{ needs.build.outputs.version }}"
      - name: Install Rust toolchain
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
      - name: Run tests
        run: cargo test

  report:
    name: Publish report
    runs-on: ubuntu-latest
    needs: [build, test]
    if: ${{ needs.build.result == 'success' && needs.test.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-binary
      - name: Write summary
        run: |
          echo "Version: ${{ needs.build.outputs.version }}" >> report.txt
          echo "Checksum: ${{ needs.build.outputs.checksum }}" >> report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt
