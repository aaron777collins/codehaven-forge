name: Container jobs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
      env:
        PIP_NO_CACHE_DIR: "1"
      options: --cpus 2 --memory 4g --env PYTHONDONTWRITEBYTECODE=1
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install --quiet -r requirements.txt
      - name: Run tests
        shell: bash
        run: python -m pytest --verbose
      - name: Report interpreter
        run: python --version

  node-build:
    name: Node 20 build
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
      options: --cpus 1 --memory 2g --shm-size 1g
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build bundle
        run: npm run build
        env:
          SOURCEMAP: "true"
