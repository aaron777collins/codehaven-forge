# Lint the Dockerfile on every change, build the image on main.
name: docker-image

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: docker://ghcr.io/hadolint/hadolint:2.12.0
        with:
          args: hadolint --failure-threshold warning Dockerfile

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull -t myorg/myapp:${{ github.sha }} .

      - name: Echo image digest
        run: |
          digest="$(docker images --no-trunc --quiet myorg/myapp:${{ github.sha }})"
          echo "built myorg/myapp:${{ github.sha }} with digest ${digest}"
