# Build and test the C++ core across compilers and build types.
name: cpp-ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

env:
  CMAKE_GENERATOR: Ninja

jobs:
  build:
    name: build (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc-12' || 'clang-15' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++-12' || 'clang++-15' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Print matrix values
        run: echo "compiler=$CC cxx=$CXX build_type=${{ matrix.build_type }} os=${{ runner.os }}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang-15 libssl-dev zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Compile
        run: cmake --build build --parallel 2

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure
