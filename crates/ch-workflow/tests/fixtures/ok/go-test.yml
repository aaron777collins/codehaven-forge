name: Go Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Vet, format, test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Go toolchain
        run: |
          curl -fsSL https://go.dev/dl/go1.23.4.linux-amd64.tar.gz -o /tmp/go.tar.gz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Cache Go module and build caches
        uses: actions/cache@v4
        with:
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build

      - name: Vet all packages
        run: go vet ./...

      - name: Check formatting
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run tests with the race detector
        run: go test -race ./...
