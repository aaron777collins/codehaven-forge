name: Build with env defaults

env:
  APP_NAME: ch-workflow
  BUILD_PROFILE: release
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash
    working-directory: ./app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --check

  build:
    name: Build app
    runs-on: ubuntu-latest
    env:
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@v4
      - name: Build with the overridden profile
        run: |
          echo "Building $APP_NAME (${{ env.BUILD_PROFILE }} profile)"
          cargo build --profile "${{ env.BUILD_PROFILE }}"
      - name: Run tests
        run: cargo test

  package:
    name: Package CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./app/cli
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "Packaging $APP_NAME from $(pwd) with profile=$BUILD_PROFILE"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-package
          path: app/cli/dist
