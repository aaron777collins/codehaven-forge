# Package a source tarball when a GitHub release is published.
name: release-tarball

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: Package source tarball
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "packaging version ${version}"

      - name: Build tarball
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="myapp-${{ steps.meta.outputs.version }}/" -o "dist/myapp-${{ steps.meta.outputs.version }}.tar.gz" HEAD
          ls -lh dist/

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: dist/*.tar.gz
          retention-days: 14

  checksums:
    name: Generate checksums
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: release-tarball
          path: dist

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Report packaged version
        run: echo "release ${{ needs.package.outputs.version }} packaged and checksummed"
