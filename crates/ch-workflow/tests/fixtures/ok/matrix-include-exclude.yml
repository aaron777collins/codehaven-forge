name: Matrix include and exclude demo

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime: [node20, deno]
        include:
          - os: ubuntu-latest
            runtime: node20
            cache_key: linux-node20
            experimental: false
          - os: macos-latest
            runtime: node20
            cache_key: macos-node20
          - os: ubuntu-latest
            runtime: deno
            cache_key: linux-deno
            experimental: true
          - os: windows-latest
            runtime: deno
            extra_flags: --unstable
            experimental: true
        exclude:
          # Deno packaging is broken on our macOS target
          - os: macos-latest
            runtime: deno
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Show matrix values
        run: |
          echo "os=${{ matrix.os }}"
          echo "runtime=${{ matrix.runtime }}"
          echo "job index=${{ strategy.job-index }}"
          echo "cache key=${{ matrix.cache_key }}"
          echo "experimental=${{ matrix.experimental }}"
      - name: Install runtime
        run: |
          if [ "${{ matrix.runtime }}" = "deno" ]; then
            curl -fsSL https://deno.land/install.sh | sh
          else
            node --version && npm --version
          fi
      - name: Extra flags path
        if: ${{ matrix.experimental == true && matrix.extra_flags != null }}
        run: echo "would run with ${{ matrix.extra_flags }}"
