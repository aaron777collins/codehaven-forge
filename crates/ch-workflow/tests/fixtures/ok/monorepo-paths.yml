name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "services/api/**"
      - "web/**"
      - "libs/**"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      libs: ${{ steps.filter.outputs.libs }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        run: |
          git fetch --quiet origin main
          changed="$(git diff --name-only origin/main...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -q '^services/api/\|^libs/'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -q '^web/\|^libs/'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -q '^libs/'; then
            echo "libs=true" >> "$GITHUB_OUTPUT"
          else
            echo "libs=false" >> "$GITHUB_OUTPUT"
          fi

  api:
    name: Build and test API
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the API service
        run: cargo build --manifest-path services/api/Cargo.toml
      - name: Run API tests
        run: cargo test --manifest-path services/api/Cargo.toml

  web:
    name: Build and test web
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci --prefix web
      - name: Build the web app
        run: npm run build --prefix web
      - name: Run web tests
        run: npm test --prefix web

  integration:
    name: Shared libs smoke check
    runs-on: ubuntu-latest
    needs: [changes, api, web]
    if: ${{ needs.changes.outputs.libs == 'true' && (needs.api.result == 'success' || needs.web.result == 'success') }}
    steps:
      - uses: actions/checkout@v4
      - name: Report which consumers are affected
        run: echo "libs changed; api=${{ needs.changes.outputs.api }} web=${{ needs.changes.outputs.web }}"
