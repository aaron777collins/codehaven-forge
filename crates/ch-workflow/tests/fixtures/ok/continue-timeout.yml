name: Timeouts and continue-on-error

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: echo "Unit tests"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bring up fixture service
        run: echo "Starting fixture service"
      - name: Flaky readiness probe
        id: probe
        continue-on-error: true
        timeout-minutes: 2
        run: |
          echo "Probing service readiness; this check is known to be flaky"
          test -f /tmp/ready
      - name: Wrap up probe status
        if: ${{ steps.probe.conclusion == 'success' }}
        run: echo "Probe outcome=${{ steps.probe.outcome }}; suite continues"
      - name: Run integration suite
        run: echo "Integration suite"

  experimental:
    name: Experimental suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run canary checks
        run: echo "Canary checks that may fail"

  summary:
    name: Summarize results
    runs-on: ubuntu-latest
    needs: [unit, integration, experimental]
    if: ${{ always() }}
    steps:
      - name: Print job results
        run: |
          echo "unit: ${{ needs.unit.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "experimental: ${{ needs.experimental.result }}"
