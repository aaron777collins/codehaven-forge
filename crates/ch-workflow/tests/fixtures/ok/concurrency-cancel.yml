name: PR validation

run-name: Validate ${{ github.ref_name }} by ${{ github.actor }}

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run linter
        run: echo "Linting..."

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: echo "Testing..."

  deploy-preview:
    name: Deploy preview environment
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: ${{ github.event_name == 'push' }}
    concurrency:
      group: deploy-preview-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Deploy preview
        run: echo "Deploying preview for ${{ github.ref_name }}"
