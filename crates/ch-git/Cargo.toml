[package]
name = "ch-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# The program git runs as a hook. `codehaven hook <stage>` does the same thing; this binary
# exists so the tests in this crate can exercise the push pipeline without the whole server.
[[bin]]
name = "ch-hook"
path = "src/bin/ch-hook.rs"

[dependencies]
ch-core.workspace = true
ch-db.workspace = true
ch-api-types.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
rand.workspace = true
hex.workspace = true
base64.workspace = true
async-compression.workspace = true
moka.workspace = true
regex.workspace = true
tempfile.workspace = true

[dev-dependencies]
ch-testkit.workspace = true
# Only for the end-to-end SSH test (tests/ssh.rs): the SSH server in front of this crate's
# transport. Not a runtime dependency.
ch-ssh.workspace = true
proptest.workspace = true
reqwest.workspace = true
tower.workspace = true
